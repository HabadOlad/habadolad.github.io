<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../habadOlad/css/main.css" />
    <title>Habad's Interactive Portfolio</title>
  </head>
  <body>
    <!--Because your CSS is using display: flex; and justify-content: space-between;, 
    the browser will automatically take those two spans and push them perfectly to opposite sides of the screen.-->
    <div id="status-bar">
      <span class="location"></span>
      <span class="stats"></span>
    </div>
    <div id="terminal">
      <div id="output"></div>

      <div id="input-line">
        <span id="nameprompt">Identify yourself sir/madam.... </span>
        <input type="text" id="input" autofocus autocomplete="off" />
      </div>
    </div>

    <script src="../habadOlad/js/habadOlad.js" type="text/javascript"></script>
  </body>
</html>
